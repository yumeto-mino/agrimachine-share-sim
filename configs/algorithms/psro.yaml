seed: 1
# Defaults follow open_spiel/python/examples/psro_v2_example.py (except oracle_type, eval_nash_conv, sims_per_entry and gpsro_iterations)
# PSRO
meta_strategy_method: alpharank            # alpharank / uniform / nash (2 players only) / prd
number_policies_selected: 1                # policies trained per iteration
sims_per_entry: 100                        # simulations per meta-game entry
gpsro_iterations: 20
symmetric_game: False
rectifier: ""                              # "" / rectified
training_strategy_selector: probabilistic  # probabilistic / top_k_probabilities / uniform / rectified
# General (RL) agent parameters
oracle_type: DQN                           # PG / DQN / BR (exact best response: max_steps <= 2 only)
number_training_episodes: 10000            # training episodes per best response (PG, DQN)
self_play_proportion: 0.0
hidden_layer_size: 256
n_hidden_layers: 4
batch_size: 32
sigma: 0.0                                 # noise when copying a policy
optimizer_str: adam                        # adam / sgd
# Policy Gradient Oracle related
loss_str: qpg                              # a2c / rpg / qpg / rm
num_q_before_pi: 8
entropy_cost: 0.001
critic_learning_rate: 1.0e-2
pi_learning_rate: 1.0e-3
# DQN
dqn_learning_rate: 1.0e-3
update_target_network_every: 1000
learn_every: 10
# General
verbose: True
eval_nash_conv: False                      # NashConv of the meta-strategy mixture (max_steps <= 2 only)
